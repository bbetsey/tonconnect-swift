name: CI

# What CI can and cannot do here, stated plainly:
#
# It CAN check every pull request — the build, the tests, and the branch rules
# below — and refuse to go green when a rule is broken.
#
# It CANNOT prevent a push. A workflow runs after the push has landed, so the
# real guard on `main` is branch protection in the repository settings, which
# uses these checks as its required status checks. See Tools/protect-branches.sh.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Branch policy
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Only develop, release/* or hotfix/* may target main
        if: github.base_ref == 'main'
        run: |
          head='${{ github.head_ref }}'
          case "$head" in
            develop|release/*|hotfix/*)
              echo "ok: $head -> main" ;;
            *)
              echo "::error::main takes develop, release/* or hotfix/* — got '$head'."
              echo "::error::Merge the work into develop first; main only ever receives a release."
              exit 1 ;;
          esac

      - name: Branches targeting develop follow <type>/<slug>
        if: github.base_ref == 'develop'
        run: |
          head='${{ github.head_ref }}'
          case "$head" in
            feat/*|fix/*|docs/*|test/*|refactor/*|perf/*|build/*|ci/*|chore/*|release/*|hotfix/*)
              echo "ok: $head" ;;
            dependabot/*)
              # Dependabot names its branches dependabot/<ecosystem>/<dep>-<version>
              # and the prefix is not configurable — only the separator is. So the
              # choice is to allow the prefix or to reject every update it opens.
              echo "ok: dependabot" ;;
            main)
              # The back-merge after a release: main carries the merge commit that
              # closed the release, and develop needs it to stay a superset. Without
              # this case the rules would forbid the very thing they make necessary.
              echo "ok: back-merge main -> develop" ;;
            *)
              echo "::error::branch '$head' does not follow <type>/<slug>."
              echo "::error::Allowed types: feat fix docs test refactor perf build ci chore release hotfix."
              echo "::error::(main is allowed too, for the back-merge after a release,"
              echo "::error::and so is dependabot/*, whose prefix it cannot rename.)"
              exit 1 ;;
          esac

  test:
    name: Build and test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: swift --version

      - name: Build
        run: swift build

      # The live-bridge smoke tests stay off by default: they talk to a public
      # bridge over the network and would make CI depend on someone else's uptime.
      #
      # Coverage rides along here rather than in a job of its own: a separate job
      # would rebuild the whole package to measure what this one just built.
      - name: Test
        run: swift test --enable-code-coverage

      # Reported, not enforced. The total is held down by TonConnectUI, whose
      # SwiftUI views measure 0% because a unit test cannot render them — a
      # threshold over the whole package would therefore be a number about the
      # UI's shape rather than about the tests. Read the per-file table instead;
      # the protocol code is where a drop matters.
      - name: Coverage
        run: |
          BIN=$(swift build --show-bin-path)
          BUNDLE=$(ls -d "$BIN"/*.xctest | head -1)
          NAME=$(basename "$BUNDLE" .xctest)
          REPORT=$(xcrun llvm-cov report \
            "$BUNDLE/Contents/MacOS/$NAME" \
            -instr-profile "$BIN/codecov/default.profdata" \
            -ignore-filename-regex='(Tests|\.build)/')
          echo "$REPORT"
          {
            echo "### Coverage"
            echo
            echo "\`\`\`"
            echo "$REPORT" | tail -1
            echo "\`\`\`"
            echo
            echo "<details><summary>Per file</summary>"
            echo
            echo "\`\`\`"
            echo "$REPORT"
            echo "\`\`\`"
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

  swift6:
    name: Swift 6 language mode
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      # Package.swift stays at swift-tools-version 5.10 on purpose: raising it to
      # 6.0 would raise the minimum Xcode for every consumer to 16. The flags
      # below turn on the Swift 6 language mode for this build only, so the
      # package is proven to compile under strict concurrency checking without
      # demanding it of anyone. Build only — the tests run in the other jobs.
      - name: Build with -swift-version 6
        run: swift build -Xswiftc -swift-version -Xswiftc 6

  simulator:
    name: iOS simulator
    runs-on: macos-latest
    # A hang is this job's failure mode, not a red assertion: the suite used to
    # sit forever on the simulator (a JS promise whose resolver GC had collected,
    # then a fake wallet answering before its POST completed). The cap turns a
    # regression into a failure within minutes instead of a six-hour runner.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      # `swift test` runs on macOS, where #if canImport(UIKit) removes
      # SystemWalletOpener and the convenience initializer TonConnect(manifestUrl:)
      # — the entry point the README opens with — before the tests ever see them.
      # This job is the only place the package is tested on the platform it ships
      # for. The device name is resolved at run time because runner images change
      # which simulators they carry.
      - name: Test on the iOS simulator
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [0-9]+[^(]*' | sed 's/ *$//')
          echo "simulator: $DEVICE"
          xcodebuild test \
            -scheme TonConnect-Package \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            -quiet

  example:
    name: Example app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      # The example depends on the package by relative path, so this build is an
      # integration test of the public API: rename something a consumer uses and
      # this job goes red, long before a release could carry the break outwards.
      - name: Build Examples/Demo against the package in this repo
        working-directory: Examples/Demo
        run: |
          xcodebuild build \
            -scheme Demo \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            -quiet

  docs:
    name: Documentation
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      # --warnings-as-errors is DocC's own flag: it fails on DocC diagnostics — a
      # link to a symbol that was renamed, a page nothing curates — and says
      # nothing about Swift compiler warnings, which are a separate conversation.
      #
      # The first version of this step grepped the whole log for "warning:" and
      # went red on `onChange(of:perform:)` deprecations instead. Those are not
      # fixable here: the two-parameter onChange starts at iOS 17 and this package
      # supports iOS 16, so the deprecated call is deliberate.
      - name: Build DocC, failing on documentation warnings
        run: |
          for target in TonConnectCore TonConnectUI; do
            echo "::group::$target"
            swift package generate-documentation --target "$target" --warnings-as-errors
            echo "::endgroup::"
          done
