# Two ecosystems, and they are worth different amounts here.
#
# github-actions is the one that pays: the workflow pins actions/checkout by
# major tag, and nothing else in this repository would notice it going stale.
#
# swift is listed on the understanding that Dependabot understands it. GitHub's
# own docs and its issue tracker disagree on that at the time of writing, so if
# this entry is rejected the config will say so on the repository's Dependabot
# page — delete it then. The stake is small either way: the package has exactly
# one dependency, swift-docc-plugin, and it is a build-time plugin that never
# reaches a consumer's binary.
#
# No target-branch on purpose. Dependabot aims at the default branch, and the
# default branch here IS develop — main is protected and takes releases only. An
# earlier version of this file spelled develop out explicitly, on the mistaken
# belief that main was the default; that was not merely redundant, because a
# configuration carrying target-branch stops applying to *security* updates,
# which go to the default branch regardless. Leaving it out keeps both kinds of
# update on the same path.
#
# If the default branch is ever changed to main, this needs revisiting: pull
# requests would start landing on a branch whose policy refuses everything but a
# release.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"

  - package-ecosystem: "swift"
    directory: "/"
    schedule:
      interval: "monthly"
